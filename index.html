<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strood · Generative IDM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #111114;
            --text-primary: #c8ccd4;
            --text-secondary: #5a6070;
            --accent: #4a9eff;
            --mood-color: #4a9eff;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                    circle at 30% 40%,
                    var(--mood-color) 0%,
                    transparent 40%
            ),
            radial-gradient(
                    circle at 70% 70%,
                    var(--mood-color) 0%,
                    transparent 40%
            );
            opacity: 0.08;
            filter: blur(100px);
            animation: drift 30s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, -40px) rotate(90deg); }
            50% { transform: translate(-30px, 30px) rotate(180deg); }
            75% { transform: translate(40px, 20px) rotate(270deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 95%;
            padding: 2.5rem;
            background: rgba(17, 17, 20, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            text-align: center;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.65rem;
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .mood-grid .mood-btn:nth-child(n+7) {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .mood-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            padding: 1.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            position: relative;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .mood-btn.active {
            background: var(--mood-color);
            border-color: var(--mood-color);
            color: var(--bg-primary);
            box-shadow: 0 0 40px rgba(74, 158, 255, 0.2);
        }

        .mood-btn .mood-desc {
            display: block;
            font-size: 0.55rem;
            margin-top: 0.5rem;
            opacity: 0.6;
            letter-spacing: 0.1em;
            text-transform: none;
        }

        .evolution-display {
            margin-bottom: 2rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2px;
        }

        .evolution-header {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--mood-color);
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .evolution-bars {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .evolution-bar {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .evolution-bar-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .evolution-bar-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .evolution-bar-fill {
            height: 100%;
            background: var(--mood-color);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .cycle-timer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .cycle-timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .cycle-timer-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .cycle-timer-count {
            font-size: 0.55rem;
            color: var(--mood-color);
            opacity: 0.8;
        }

        .cycle-timer-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .cycle-timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--mood-color), var(--mood-color));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .cycle-timer-fill.pulse {
            animation: timerPulse 0.4s ease-out;
        }

        .cycle-timer-fill.radical {
            background: linear-gradient(90deg, var(--mood-color), #ff6b6b);
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.4);
        }

        .cycle-timer-label.radical {
            color: #ff6b6b;
        }

        @keyframes timerPulse {
            0% {
                box-shadow: 0 0 10px var(--mood-color);
                opacity: 1;
            }
            100% {
                box-shadow: 0 0 0px var(--mood-color);
                opacity: 0.8;
            }
        }

        .play-controls {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .play-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 0.9rem 2.5rem;
            background: var(--mood-color);
            border: none;
            border-radius: 2px;
            color: var(--bg-primary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            filter: brightness(1.1);
        }

        .play-btn.stop {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        .play-btn.stop:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .status {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .status.playing {
            color: var(--mood-color);
        }

        .code-display {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.7;
        }

        .code-display-header {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--mood-color);
            margin-bottom: 0.75rem;
            opacity: 0.7;
        }

        .code-line {
            color: var(--text-primary);
            margin: 0.2rem 0;
        }

        .code-comment {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .code-display::-webkit-scrollbar {
            width: 4px;
        }

        .code-display::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .code-display::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .mood-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .evolution-bars {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Strood</h1>
    <p class="subtitle">Evolving Generative Soundscapes</p>

    <div class="mood-grid">
        <button class="mood-btn" data-mood="metallic">
            Metallic
            <span class="mood-desc">Cold FM textures, machine pulse</span>
        </button>
        <button class="mood-btn" data-mood="fractured">
            Fractured
            <span class="mood-desc">Granular glitch, bit decay</span>
        </button>
        <button class="mood-btn" data-mood="submerged">
            Submerged
            <span class="mood-desc">Deep sub, filtered darkness</span>
        </button>
        <button class="mood-btn" data-mood="algorithmic">
            Algorithmic
            <span class="mood-desc">Polyrhythmic complexity</span>
        </button>
        <button class="mood-btn" data-mood="crystalline">
            Crystalline
            <span class="mood-desc">FM bells, sparse ethereal</span>
        </button>
        <button class="mood-btn" data-mood="industrial">
            Industrial
            <span class="mood-desc">Resonant, mechanical, raw</span>
        </button>
        <button class="mood-btn" data-mood="ethereal">
            Ethereal
            <span class="mood-desc">Dreamy pads, floating melody</span>
        </button>
        <button class="mood-btn" data-mood="nostalgia">
            Nostalgia
            <span class="mood-desc">Warm arpeggios, gentle glow</span>
        </button>
        <button class="mood-btn" data-mood="drift">
            Drift
            <span class="mood-desc">Slow ambient, soft washes</span>
        </button>
    </div>

    <div class="evolution-display">
        <div class="evolution-header">Evolution State</div>
        <div class="evolution-bars">
            <div class="evolution-bar">
                <span class="evolution-bar-label">Filter</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="filter-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">FM Depth</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="fm-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">Density</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="density-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">Space</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="space-bar"></div>
                </div>
            </div>
        </div>
        <div class="cycle-timer">
            <div class="cycle-timer-header">
                <span class="cycle-timer-label">Next Evolution</span>
                <span class="cycle-timer-count" id="cycle-count">Cycle 0</span>
            </div>
            <div class="cycle-timer-track">
                <div class="cycle-timer-fill" id="cycle-timer-fill"></div>
            </div>
        </div>
    </div>

    <div class="play-controls">
        <button class="play-btn" id="play-btn">Initiate</button>
        <button class="play-btn stop" id="stop-btn">Halt</button>
    </div>

    <div class="status" id="status">Awaiting initialization...</div>

    <div class="code-display" id="code-display">
        <div class="code-display-header">Active Pattern</div>
        <div id="code-content" class="code-comment">// Pattern code will appear when active</div>
    </div>
</div>

<!-- Load Strudel Web bundle -->
<script src="https://unpkg.com/@strudel/web@1.2.6"></script>

<script>
    // Mood color mappings
    const moodColors = {
        // IDM/cold palette
        metallic: '#4a9eff',
        fractured: '#ff6b4a',
        submerged: '#1a8f7d',
        algorithmic: '#9b6bff',
        crystalline: '#7dd3fc',
        industrial: '#f97316',
        // Dreamy/warm palette
        ethereal: '#c4b5fd',
        nostalgia: '#fbbf24',
        drift: '#67e8f9'
    };

    // State
    let currentMood = null;
    let isPlaying = false;
    let strudelReady = false;
    let evolutionInterval = null;
    let evolutionState = {
        filter: 0.3,
        fm: 0.4,
        density: 0.5,
        space: 0.6
    };
    let cycleState = {
        startTime: 0,
        duration: 12000, // 12 seconds per cycle
        count: 0,
        epoch: 0,
        cyclesPerEpoch: 5, // Customizable: radical shift every N cycles
        isTransitioning: false
    };

    // Musical variation pools for evolution
    // HARMONIC ORGANIZATION:
    // - IDM moods (metallic, fractured, submerged, algorithmic, crystalline, industrial)
    //   use C natural minor: C, D, Eb, F, G, Ab, Bb
    // - Dreamy moods (ethereal, nostalgia, drift)
    //   use G major / C Lydian: G, A, B, C, D, E, F#
    // All variations within each family are harmonically compatible
    const evolutionPools = {
        // === C MINOR FAMILY (for IDM moods) ===
        // All in C natural minor: C, D, Eb, F, G, Ab, Bb

        // Bass note sequences (C minor)
        bassNotes: [
            "<c2 eb2 g2 bb2>",      // Cm7 arpeggio
            "<c2 f2 g2 bb2>",       // Cm7 variation
            "<c2 eb2 f2 g2>",       // Cm add4
            "<c2 g2 bb2 c3>",       // Cm octave
            "<c2 eb2 ab2 g2>",      // Cm - Ab
            "<c2 f2 ab2 g2>",       // C - F - Ab - G
            "<c2 bb1 ab1 g1>",      // Descending
            "<c2 d2 eb2 g2>"        // C minor scale fragment
        ],
        // Sub bass notes (root movement in C minor)
        subNotes: [
            "<c1 ~ c1 ~ g1 ~ g1 ~>",       // C - G pedal
            "<c1 ~ eb1 ~ f1 ~ g1 ~>",      // Scale walk
            "<c1 ~ ~ c1 ~ ~ g1 ~>",        // Sparse C - G
            "<c1 ~ f1 ~ c1 ~ g1 ~>",       // C - F - C - G
            "<c1 ~ ab0 ~ bb0 ~ c1 ~>",     // Ab - Bb - C
            "<c1 ~ ~ ~ g1 ~ ~ ~>"          // Very sparse
        ],
        // High melodic fragments (C minor pentatonic: C, Eb, F, G, Bb)
        highNotes: [
            "<c5 ~ eb5 ~ ~ g5 ~ ~>",
            "<eb5 ~ g5 ~ ~ c6 ~ ~>",
            "<g5 ~ bb5 ~ ~ c6 ~ ~>",
            "<c5 ~ f5 ~ ~ g5 ~ ~>",
            "<bb4 ~ c5 ~ ~ eb5 ~ ~>",
            "<g5 ~ ~ c6 ~ ~ eb6 ~>",
            "~ c5 ~ ~ ~ eb5 ~ ~ ~ ~ g5 ~ ~ ~ c6 ~",
            "~ ~ eb5 ~ ~ ~ g5 ~ ~ ~ bb5 ~ ~ ~ ~ ~"
        ],
        // Chord voicings (C minor family - Cm, Fm, Gm, Ab, Bb, Eb)
        chords: [
            "<[c3,eb3,g3] [f3,ab3,c4] [g3,bb3,d4]>",           // Cm - Fm - Gm
            "<[c3,eb3,g3,bb3] [ab2,c3,eb3,g3]>",               // Cm7 - Abmaj7
            "<[eb3,g3,bb3] [ab2,c3,eb3] [bb2,d3,f3]>",         // Eb - Ab - Bb
            "<[c3,eb3,g3] [bb2,d3,f3] [ab2,c3,eb3]>",          // Cm - Bb - Ab
            "<[f3,ab3,c4] [eb3,g3,bb3] [c3,eb3,g3]>",          // Fm - Eb - Cm
            "<[g3,bb3,d4] [f3,ab3,c4] [eb3,g3,bb3]>",          // Gm - Fm - Eb
            "<[c3,eb3,bb3] [ab2,eb3,g3] [bb2,f3,ab3]>",        // Cm7 - Ab - Bb
            "<[c3,g3,c4] [eb3,bb3,eb4] [f3,c4,f4]>"            // Open voicings
        ],
        // Arpeggios (C minor family)
        arpeggios: [
            "c4 eb4 g4 bb4 c5 bb4 g4 eb4",     // Cm7
            "c4 eb4 g4 c5 g4 eb4 c4 g3",       // Cm
            "eb4 g4 bb4 eb5 bb4 g4 eb4 bb3",   // Eb
            "f4 ab4 c5 f5 c5 ab4 f4 c4",       // Fm
            "g4 bb4 d5 g5 d5 bb4 g4 d4",       // Gm
            "ab3 c4 eb4 ab4 eb4 c4 ab3 eb3",   // Ab
            "bb3 d4 f4 bb4 f4 d4 bb3 f3",      // Bb
            "c4 g4 c5 eb5 c5 g4 eb4 c4"        // Cm spread
        ],
        // Euclidean kick patterns
        kickPatterns: [
            "bd(3,8)",
            "bd(5,8)",
            "bd(3,8,<0 1 2>)",
            "bd(5,8,<0 2>)",
            "bd(<3 5>,8)",
            "bd(<3 5 2 4>,<8 7 9 11>)",
            "bd(7,16)",
            "bd ~ bd:1 ~",
            "bd ~ [bd bd:1] ~",
            "bd(<3 4 5 3>,8)"
        ],
        // Euclidean hat patterns
        hatPatterns: [
            "hh(11,16)",
            "hh(13,16)",
            "hh(<11 13>,16)",
            "hh(<13 17 11>,<16 16 16>)",
            "hh*<8 12 16 6>",
            "hh*<8 10 12 14 16 14 12 10>",
            "hh(11,16,<0 1 2>)",
            "hh(<11 13 17>,16)"
        ],
        // Snare patterns
        snarePatterns: [
            "~ sd(3,8,<0 2 1>)",
            "sd(<3 4 5>,<8 9 7>,<0 1 2 3>)",
            "~ [sd cp] ~ <sd rim>",
            "~ sd ~ <sd [sd*2]>",
            "sd(<3 5>,8,<1 0 2>)",
            "~ sd(3,8) ~",
            "~ <sd [sd cp]> ~ sd",
            "sd(<3 4>,<8 7>,<0 2>)"
        ],
        // Arpeggio speeds
        arpSpeeds: ["<1 1.5 2>", "<1 2 1.5>", "<0.5 1 1.5>", "<1 1.5 2 1.5>", "<2 1 0.5>"],
        // FM modulation ranges
        fmRanges: [[2, 5], [1, 4], [3, 8], [2, 6], [1, 6], [4, 10]],
        // Filter ranges
        filterRanges: [[200, 500], [300, 600], [250, 700], [400, 900], [200, 800], [300, 1000]],
        // Cycle durations (ms)
        cycleDurations: [10000, 12000, 14000, 16000, 18000, 20000],

        // === G MAJOR / C LYDIAN FAMILY (for dreamy moods) ===
        // All in G major: G, A, B, C, D, E, F#
        // Which is same as C Lydian: C, D, E, F#, G, A, B

        // Warm pad chords (G major family - Gmaj7, Am7, Bm7, Cmaj7#11, D7, Em7, F#m7b5)
        warmChords: [
            "<[g3,b3,d4,f#4] [c3,e3,g3,b3] [d3,f#3,a3,c4]>",   // Gmaj7 - Cmaj7 - D7
            "<[c3,e3,g3,b3] [g3,b3,d4,f#4] [a3,c4,e4,g4]>",    // Cmaj7 - Gmaj7 - Am7
            "<[e3,g3,b3,d4] [a3,c4,e4,g4] [d3,f#3,a3,c4]>",    // Em7 - Am7 - D7
            "<[g3,b3,d4] [c3,e3,g3] [d3,f#3,a3]>",             // G - C - D
            "<[c3,e3,g3,b3] [d3,f#3,a3,c4] [e3,g3,b3,d4]>",    // Cmaj7 - D7 - Em7
            "<[a3,c4,e4] [g3,b3,d4] [e3,g3,b3]>",              // Am - G - Em
            "<[g3,d4,g4] [c3,g3,c4] [d3,a3,d4]>",              // Open voicings
            "<[e3,b3,e4] [a3,e4,a4] [g3,d4,g4]>"               // Open voicings
        ],

        // Arpeggios (G major family)
        brightArpeggios: [
            "g4 b4 d5 g5 d5 b4 g4 d4",         // G
            "c4 e4 g4 c5 g4 e4 c4 g3",         // C
            "d4 f#4 a4 d5 a4 f#4 d4 a3",       // D
            "e4 g4 b4 e5 b4 g4 e4 b3",         // Em
            "a4 c5 e5 a5 e5 c5 a4 e4",         // Am
            "g4 b4 d5 f#5 d5 b4 g4 d4",        // Gmaj7
            "c4 e4 g4 b4 g4 e4 c4 g3",         // Cmaj7
            "d4 a4 d5 f#5 d5 a4 f#4 d4"        // D spread
        ],

        // Gentle melodic fragments (G major pentatonic: G, A, B, D, E)
        gentleMelodies: [
            "~ g5 ~ ~ b5 ~ ~ d6 ~ ~ ~ ~ ~ ~ ~ ~",
            "~ ~ a5 ~ ~ ~ d6 ~ ~ ~ e6 ~ ~ ~ ~ ~",
            "e5 ~ ~ ~ g5 ~ ~ ~ b5 ~ ~ ~ d6 ~ ~ ~",
            "~ b5 ~ ~ ~ d6 ~ ~ ~ g6 ~ ~ ~ ~ ~ ~",
            "~ ~ ~ g5 ~ ~ ~ b5 ~ ~ ~ e6 ~ ~ ~ ~",
            "d5 ~ ~ ~ ~ g5 ~ ~ ~ ~ b5 ~ ~ ~ ~ d6",
            "~ a5 ~ ~ ~ ~ d6 ~ ~ ~ ~ e6 ~ ~ ~ ~",
            "~ ~ ~ ~ g5 ~ ~ ~ ~ ~ b5 ~ ~ ~ ~ d6"
        ],

        // Soft ambient percussion (cymbal washes, gentle)
        ambientPerc: [
            "~ ~ ~ ~ ~ ~ ~ oh:3",
            "~ ~ ~ ~ oh:2 ~ ~ ~",
            "~ ~ ~ ~ ~ ~ oh:1 ~",
            "oh:3 ~ ~ ~ ~ ~ ~ ~",
            "~ ~ oh:2 ~ ~ ~ ~ ~",
            "~ ~ ~ ~ ~ oh:1 ~ ~"
        ],

        // Long cymbal/wash patterns
        washPatterns: [
            "~ ~ ~ ~ ~ ~ ~ ~",
            "oh:3 ~ ~ ~ ~ ~ ~ ~",
            "~ ~ ~ ~ oh:2 ~ ~ ~",
            "~ ~ ~ oh:1 ~ ~ ~ oh:3"
        ],

        // Slow arp speeds for ambient
        slowArpSpeeds: ["<0.5 0.25>", "<0.5 0.75>", "<0.25 0.5>", "<0.75 0.5 0.25>", "0.5"]
    };

    // Current variation state
    let currentVariation = {
        bassNotes: 0,
        subNotes: 0,
        highNotes: 0,
        chords: 0,
        arpeggios: 0,
        kickPattern: 0,
        hatPattern: 0,
        snarePattern: 0,
        arpSpeed: 0,
        fmRange: 0,
        filterRange: 0
    };

    // Pick random index different from current
    function evolveIndex(current, poolLength) {
        let next = Math.floor(Math.random() * poolLength);
        // Try to pick something different
        if (poolLength > 1 && next === current) {
            next = (next + 1) % poolLength;
        }
        return next;
    }

    // Subtle evolution: only tonal/timbral changes, no rhythm changes
    function evolveSubtle() {
        const pools = evolutionPools;

        // Only evolve timbral parameters - keep rhythm and notes stable
        if (Math.random() > 0.4) {
            currentVariation.fmRange = evolveIndex(currentVariation.fmRange, pools.fmRanges.length);
        }
        if (Math.random() > 0.4) {
            currentVariation.filterRange = evolveIndex(currentVariation.filterRange, pools.filterRanges.length);
        }
        // Occasionally shift arp speed slightly
        if (Math.random() > 0.7) {
            currentVariation.arpSpeed = evolveIndex(currentVariation.arpSpeed, pools.arpSpeeds.length);
        }
    }

    // Radical evolution: change notes, chords, and rhythms
    function evolveRadical() {
        const pools = evolutionPools;

        // Evolve melodic/harmonic content
        if (Math.random() > 0.3) {
            currentVariation.bassNotes = evolveIndex(currentVariation.bassNotes, pools.bassNotes.length);
        }
        if (Math.random() > 0.4) {
            currentVariation.subNotes = evolveIndex(currentVariation.subNotes, pools.subNotes.length);
        }
        if (Math.random() > 0.3) {
            currentVariation.highNotes = evolveIndex(currentVariation.highNotes, pools.highNotes.length);
        }
        if (Math.random() > 0.3) {
            currentVariation.chords = evolveIndex(currentVariation.chords, pools.chords.length);
        }
        if (Math.random() > 0.4) {
            currentVariation.arpeggios = evolveIndex(currentVariation.arpeggios, pools.arpeggios.length);
        }

        // Evolve rhythmic patterns
        if (Math.random() > 0.4) {
            currentVariation.kickPattern = evolveIndex(currentVariation.kickPattern, pools.kickPatterns.length);
        }
        if (Math.random() > 0.4) {
            currentVariation.hatPattern = evolveIndex(currentVariation.hatPattern, pools.hatPatterns.length);
        }
        if (Math.random() > 0.5) {
            currentVariation.snarePattern = evolveIndex(currentVariation.snarePattern, pools.snarePatterns.length);
        }

        // Also evolve timbral parameters
        currentVariation.arpSpeed = evolveIndex(currentVariation.arpSpeed, pools.arpSpeeds.length);
        currentVariation.fmRange = evolveIndex(currentVariation.fmRange, pools.fmRanges.length);
        currentVariation.filterRange = evolveIndex(currentVariation.filterRange, pools.filterRanges.length);
    }

    // Graceful transition for radical shifts
    function gracefulTransition(callback) {
        cycleState.isTransitioning = true;
        status.textContent = 'Transitioning...';

        // Longer transition for ambient moods
        const isAmbientMood = ['ethereal', 'nostalgia', 'drift'].includes(currentMood);
        const ringOutTime = isAmbientMood ? 3500 : 2000;
        const tailDecayTime = isAmbientMood ? 2500 : 1500;

        // Let current pattern ring out
        setTimeout(() => {
            if (typeof hush === 'function') {
                hush();
            }

            // Wait for reverb/delay tails to decay
            setTimeout(() => {
                cycleState.isTransitioning = false;
                if (callback) callback();
            }, tailDecayTime);
        }, ringOutTime);
    }

    // Randomize all variations (for initial start)
    function randomizeVariations() {
        const pools = evolutionPools;
        currentVariation.bassNotes = Math.floor(Math.random() * pools.bassNotes.length);
        currentVariation.subNotes = Math.floor(Math.random() * pools.subNotes.length);
        currentVariation.highNotes = Math.floor(Math.random() * pools.highNotes.length);
        currentVariation.chords = Math.floor(Math.random() * pools.chords.length);
        currentVariation.arpeggios = Math.floor(Math.random() * pools.arpeggios.length);
        currentVariation.kickPattern = Math.floor(Math.random() * pools.kickPatterns.length);
        currentVariation.hatPattern = Math.floor(Math.random() * pools.hatPatterns.length);
        currentVariation.snarePattern = Math.floor(Math.random() * pools.snarePatterns.length);
        currentVariation.arpSpeed = Math.floor(Math.random() * pools.arpSpeeds.length);
        currentVariation.fmRange = Math.floor(Math.random() * pools.fmRanges.length);
        currentVariation.filterRange = Math.floor(Math.random() * pools.filterRanges.length);
    }

    // DOM elements
    const moodButtons = document.querySelectorAll('.mood-btn');
    const playButton = document.getElementById('play-btn');
    const stopButton = document.getElementById('stop-btn');
    const status = document.getElementById('status');
    const codeContent = document.getElementById('code-content');
    const filterBar = document.getElementById('filter-bar');
    const fmBar = document.getElementById('fm-bar');
    const densityBar = document.getElementById('density-bar');
    const spaceBar = document.getElementById('space-bar');
    const cycleTimerFill = document.getElementById('cycle-timer-fill');
    const cycleCount = document.getElementById('cycle-count');
    const cycleTimerLabel = document.querySelector('.cycle-timer-label');

    // Wait for Strudel to load and initialize
    async function initStrudelApp() {
        try {
            await new Promise(resolve => setTimeout(resolve, 500));

            if (typeof initStrudel === 'function') {
                console.log('Initializing Strudel...');
                await initStrudel({
                    prebake: () => {
                        console.log('Loading drum samples...');
                        return samples('https://strudel.b-cdn.net/tidal-drum-machines.json');
                    }
                });
                console.log('Strudel initialized');

                strudelReady = true;
                status.textContent = 'Select mode to begin';
            } else {
                console.error('initStrudel not found');
                status.textContent = 'Error: Engine not loaded';
            }
        } catch (error) {
            console.error('Error initializing Strudel:', error);
            status.textContent = 'Error: ' + error.message;
        }
    }

    // Initialize when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStrudelApp);
    } else {
        initStrudelApp();
    }

    // Update evolution bars
    function updateEvolutionBars() {
        filterBar.style.width = `${evolutionState.filter * 100}%`;
        fmBar.style.width = `${evolutionState.fm * 100}%`;
        densityBar.style.width = `${evolutionState.density * 100}%`;
        spaceBar.style.width = `${evolutionState.space * 100}%`;
    }

    // Evolve state naturally
    function evolveState() {
        const time = Date.now() / 1000;
        const now = Date.now();

        // Use different sine wave periods for each parameter
        evolutionState.filter = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.05));
        evolutionState.fm = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(time * 0.03 + 1));
        evolutionState.density = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.04 + 2));
        evolutionState.space = 0.4 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.025 + 3));

        updateEvolutionBars();

        // Update cycle timer
        const elapsed = now - cycleState.startTime;
        const progress = Math.min(elapsed / cycleState.duration, 1);
        cycleTimerFill.style.width = `${progress * 100}%`;

        // Check if next cycle will be a radical shift
        const nextCycleInEpoch = (cycleState.count % cycleState.cyclesPerEpoch) + 1;
        const isNextRadical = nextCycleInEpoch === cycleState.cyclesPerEpoch;
        cycleTimerFill.classList.toggle('radical', isNextRadical);
        cycleTimerLabel.classList.toggle('radical', isNextRadical);
        cycleTimerLabel.textContent = isNextRadical ? 'Radical Shift' : 'Next Evolution';

        // Check if cycle completed
        if (elapsed >= cycleState.duration && !cycleState.isTransitioning) {
            cycleState.count++;
            cycleState.startTime = now;

            const cycleInEpoch = ((cycleState.count - 1) % cycleState.cyclesPerEpoch) + 1;
            const isRadicalShift = cycleInEpoch === cycleState.cyclesPerEpoch;

            if (isRadicalShift) {
                cycleState.epoch++;
            }

            // Update display
            cycleCount.textContent = `Epoch ${cycleState.epoch} · ${cycleInEpoch}/${cycleState.cyclesPerEpoch}`;

            // Pulse animation on cycle complete
            cycleTimerFill.classList.add('pulse');
            setTimeout(() => cycleTimerFill.classList.remove('pulse'), 400);

            if (isRadicalShift) {
                // Radical shift: graceful transition with structural changes
                gracefulTransition(() => {
                    evolveRadical();
                    if (isPlaying && currentMood) {
                        status.textContent = `${currentMood.toUpperCase()} · Epoch ${cycleState.epoch}`;
                        playPattern();
                    }
                });
            } else {
                // Subtle shift: tonal/timbral changes, smooth pattern update
                evolveSubtle();
                if (isPlaying && currentMood) {
                    // Rebuild pattern with new timbral values (Strudel replaces smoothly)
                    playPattern(true); // true = subtle mode, no hush
                }
            }

            // Randomize next cycle duration (longer for ambient moods)
            const isAmbientMood = ['ethereal', 'nostalgia', 'drift'].includes(currentMood);
            const baseDuration = evolutionPools.cycleDurations[
                Math.floor(Math.random() * evolutionPools.cycleDurations.length)
            ];
            cycleState.duration = isAmbientMood ? baseDuration * 1.5 : baseDuration;
        }
    }

    // Reset cycle timer
    function resetCycleTimer() {
        cycleState.startTime = Date.now();
        cycleState.count = 0;
        cycleState.epoch = 1;
        cycleState.duration = 12000;
        cycleState.isTransitioning = false;
        cycleTimerFill.style.width = '0%';
        cycleTimerFill.classList.remove('radical');
        cycleTimerLabel.classList.remove('radical');
        cycleTimerLabel.textContent = 'Next Evolution';
        cycleCount.textContent = `Epoch 1 · 0/${cycleState.cyclesPerEpoch}`;
    }

    // Mood selection
    moodButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const mood = btn.dataset.mood;
            currentMood = mood;

            moodButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.documentElement.style.setProperty('--mood-color', moodColors[mood]);
            status.textContent = `${mood.toUpperCase()} mode selected`;

            if (isPlaying) {
                playPattern();
            }
        });
    });

    // Play/Stop controls
    playButton.addEventListener('click', () => {
        if (!strudelReady) {
            status.textContent = 'Engine initializing...';
            return;
        }
        if (!currentMood) {
            status.textContent = 'Select mode first';
            return;
        }
        isPlaying = true;
        playPattern();
        status.textContent = `${currentMood.toUpperCase()} active`;
        status.classList.add('playing');

        // Randomize initial variations and reset cycle timer
        randomizeVariations();
        resetCycleTimer();

        // Start evolution animation
        if (evolutionInterval) clearInterval(evolutionInterval);
        evolutionInterval = setInterval(evolveState, 100);
    });

    stopButton.addEventListener('click', () => {
        isPlaying = false;
        if (typeof hush === 'function') {
            hush();
        }
        if (evolutionInterval) {
            clearInterval(evolutionInterval);
            evolutionInterval = null;
        }
        // Reset timer display
        cycleTimerFill.style.width = '0%';
        cycleTimerFill.classList.remove('radical');
        cycleTimerLabel.classList.remove('radical');
        cycleTimerLabel.textContent = 'Next Evolution';
        cycleCount.textContent = `Epoch 0 · 0/${cycleState.cyclesPerEpoch}`;
        cycleState.isTransitioning = false;

        status.textContent = currentMood ? `${currentMood.toUpperCase()} halted` : 'Halted';
        status.classList.remove('playing');
        codeContent.innerHTML = '<div class="code-comment">// Pattern halted</div>';
    });

                case 'industrial':
                    // Resonant, mechanical, raw
                    codeLines = [
                        '// INDUSTRIAL - Resonant mechanical',
                        `// Epoch ${cycleState.epoch} · Cycle ${cycleState.count}${subtle ? ' (subtle)' : ''}`,
                        'stack(',
                        `  s("${kickPat}").bank("RolandTR909")`,
                        '    .gain(0.7).room(0.4).lpf(700)',
                        '    .sometimes(x => x.distort(0.3)),',
                        `  s("${hatPat}").bank("RolandTR808")`,
                        '    .n(irand(4)).gain(rand.range(0.3,0.45))',
                        '    .room(0.7).delay(0.4).hpf(3800)',
                        '    .sometimes(x => x.chop(2)),',
                        `  note("${bassNotes}/2").s("sawtooth")`,
                        `    .fm(perlin.range(${fmRange[0]},${fmRange[1]}).slow(8))`,
                        '    .fmh(sine.range(1,4).slow(6))',
                        `    .lpf(perlin.range(${filterRange[0]},${filterRange[1]}).slow(4))`,
                        '    .lpq(18).gain(0.55).room(0.5).distort(0.2),',
                        `  note("${arpNotes}".fast("${arpSpeed}").add(irand(7)))`,
                        '    .s("square").lpf(perlin.range(800,2000).slow(4))',
                        '    .lpq(6).gain(0.3).room(0.8).delay(0.5),',
                        `  note("${chordNotes}/16").s("sawtooth")`,
                        '    .lpf(400).gain(0.3).room(1.5).attack(3).release(4)',
                        ')'
                    ];
                    pattern = stack(
                        s(kickPat).bank("RolandTR909")
                            .gain(0.7).room(0.4).lpf(700)
                            .sometimes(x => x.distort(0.3)),
                        s(hatPat).bank("RolandTR808")
                            .n(irand(4)).gain(rand.range(0.3, 0.45))
                            .room(0.7).delay(0.4).hpf(3800)
                            .sometimes(x => x.chop(2))
                            .rarely(x => x.fast(2)),
                        s(snarePat).bank("RolandTR909")
                            .gain(0.55).room(0.6),
                        note(bassNotes + "/2")
                            .s("sawtooth")
                            .fm(perlin.range(fmRange[0], fmRange[1]).slow(8))
                            .fmh(sine.range(1, 4).slow(6))
                            .lpf(perlin.range(filterRange[0], filterRange[1]).slow(4))
                            .lpq(18)
                            .gain(0.55)
                            .room(0.5)
                            .distort(0.2),
                        note(arpNotes).fast(arpSpeed).add(irand(7))
                            .s("square")
                            .lpf(perlin.range(800, 2000).slow(4))
                            .lpq(6)
                            .gain(0.3)
                            .room(0.8)
                            .delay(0.5),
                        note(chordNotes + "/16")
                            .s("sawtooth")
                            .lpf(400)
                            .gain(0.3)
                            .room(1.5)
                            .attack(3)
                            .release(4)
                    );
                    break;

                case 'ethereal':
                    // Dreamy pads, floating melody, no drums
                    const warmChord = pools.warmChords[v.chords % pools.warmChords.length];
                    const gentleMelody = pools.gentleMelodies[v.highNotes % pools.gentleMelodies.length];
                    const brightArp = pools.brightArpeggios[v.arpeggios % pools.brightArpeggios.length];
                    const slowSpeed = pools.slowArpSpeeds[v.arpSpeed % pools.slowArpSpeeds.length];

                    codeLines = [
                        '// ETHEREAL - Dreamy floating',
                        `// Epoch ${cycleState.epoch} · Cycle ${cycleState.count}${subtle ? ' (subtle)' : ''}`,
                        'stack(',
                        `  note("${warmChord}/4").s("sawtooth")`,
                        `    .lpf(sine.range(${filterRange[0] + 400},${filterRange[1] + 800}).slow(20))`,
                        '    .gain(0.35).room(2).attack(3).release(5),',
                        `  note("${brightArp}").slow(${slowSpeed}).s("triangle")`,
                        `    .lpf(${filterRange[1] + 1000}).gain(0.2).room(1.5)`,
                        '    .delay(0.6).delaytime(0.375).delayfeedback(0.6),',
                        `  note("${gentleMelody}").s("sine")`,
                        '    .lpf(2500).gain(0.25).room(2)',
                        '    .delay(0.7).delayfeedback(0.7)',
                        ').slow(2)'
                    ];
                    pattern = stack(
                        note(warmChord + "/4")
                            .s("sawtooth")
                            .lpf(sine.range(filterRange[0] + 400, filterRange[1] + 800).slow(20))
                            .gain(0.35)
                            .room(2)
                            .attack(3)
                            .release(5),
                        note(brightArp).slow(slowSpeed)
                            .s("triangle")
                            .lpf(filterRange[1] + 1000)
                            .gain(0.2)
                            .room(1.5)
                            .delay(0.6)
                            .delaytime(0.375)
                            .delayfeedback(0.6),
                        note(gentleMelody)
                            .s("sine")
                            .lpf(2500)
                            .gain(0.25)
                            .room(2)
                            .delay(0.7)
                            .delayfeedback(0.7)
                    ).slow(2);
                    break;

                case 'nostalgia':
                    // Fez-inspired warm arpeggios, gentle glow
                    const nostalgiaChord = pools.warmChords[v.chords % pools.warmChords.length];
                    const nostalgiaArp = pools.brightArpeggios[v.arpeggios % pools.brightArpeggios.length];
                    const nostalgiaMelody = pools.gentleMelodies[v.highNotes % pools.gentleMelodies.length];
                    const nostalgiaSpeed = pools.slowArpSpeeds[v.arpSpeed % pools.slowArpSpeeds.length];
                    const ambientCymbal = pools.ambientPerc[v.hatPattern % pools.ambientPerc.length];

                    codeLines = [
                        '// NOSTALGIA - Warm Fez-like glow',
                        `// Epoch ${cycleState.epoch} · Cycle ${cycleState.count}${subtle ? ' (subtle)' : ''}`,
                        'stack(',
                        `  note("${nostalgiaArp}").slow(${nostalgiaSpeed}).s("square")`,
                        `    .lpf(perlin.range(${filterRange[0] + 800},${filterRange[1] + 1200}).slow(12))`,
                        '    .gain(0.22).room(1.2).delay(0.5).delaytime("<0.25 0.375>"),',
                        `  note("${nostalgiaChord}/8").s("triangle")`,
                        '    .lpf(1200).gain(0.3).room(1.8)',
                        '    .attack(2).release(4),',
                        `  note("${nostalgiaMelody}").s("sine")`,
                        '    .lpf(3000).gain(0.2).room(1.5)',
                        '    .delay(0.6).delayfeedback(0.65),',
                        `  s("${ambientCymbal}").bank("RolandTR909")`,
                        '    .gain(0.15).room(2.5).lpf(3000)',
                        ').slow(1.5)'
                    ];
                    pattern = stack(
                        note(nostalgiaArp).slow(nostalgiaSpeed)
                            .s("square")
                            .lpf(perlin.range(filterRange[0] + 800, filterRange[1] + 1200).slow(12))
                            .gain(0.22)
                            .room(1.2)
                            .delay(0.5)
                            .delaytime("<0.25 0.375>"),
                        note(nostalgiaChord + "/8")
                            .s("triangle")
                            .lpf(1200)
                            .gain(0.3)
                            .room(1.8)
                            .attack(2)
                            .release(4),
                        note(nostalgiaMelody)
                            .s("sine")
                            .lpf(3000)
                            .gain(0.2)
                            .room(1.5)
                            .delay(0.6)
                            .delayfeedback(0.65),
                        s(ambientCymbal).bank("RolandTR909")
                            .gain(0.15)
                            .room(2.5)
                            .lpf(3000)
                    ).slow(1.5);
                    break;

                case 'drift':
                    // Slow ambient, soft washes, minimal
                    const driftChord = pools.warmChords[v.chords % pools.warmChords.length];
                    const driftMelody = pools.gentleMelodies[v.highNotes % pools.gentleMelodies.length];
                    const driftWash = pools.washPatterns[v.hatPattern % pools.washPatterns.length];

                    codeLines = [
                        '// DRIFT - Slow ambient wash',
                        `// Epoch ${cycleState.epoch} · Cycle ${cycleState.count}${subtle ? ' (subtle)' : ''}`,
                        'stack(',
                        `  note("${driftChord}/16").s("sawtooth")`,
                        `    .lpf(sine.range(${filterRange[0]},${filterRange[1] + 400}).slow(32))`,
                        '    .gain(0.4).room(2.5).attack(4).release(8),',
                        `  note("${driftMelody}").slow(2).s("sine")`,
                        '    .lpf(2000).gain(0.18).room(2)',
                        '    .delay(0.8).delayfeedback(0.75).delaytime(0.5),',
                        `  s("${driftWash}").bank("RolandTR909")`,
                        '    .gain(0.12).room(3).lpf(2500).slow(2),',
                        '  note("<c2 g2>/16").s("sine")',
                        '    .lpf(200).gain(0.35).room(1)',
                        ').slow(3)'
                    ];
                    pattern = stack(
                        note(driftChord + "/16")
                            .s("sawtooth")
                            .lpf(sine.range(filterRange[0], filterRange[1] + 400).slow(32))
                            .gain(0.4)
                            .room(2.5)
                            .attack(4)
                            .release(8),
                        note(driftMelody).slow(2)
                            .s("sine")
                            .lpf(2000)
                            .gain(0.18)
                            .room(2)
                            .delay(0.8)
                            .delayfeedback(0.75)
                            .delaytime(0.5),
                        s(driftWash).bank("RolandTR909")
                            .gain(0.12)
                            .room(3)
                            .lpf(2500)
                            .slow(2),
                        note("<c2 g2>/16")
                            .s("sine")
                            .lpf(200)
                            .gain(0.35)
                            .room(1)
                    ).slow(3);
                    break;
            }

            // Update code display
            codeContent.innerHTML = codeLines.map((line) => {
                if (line.startsWith('//')) {
                    return `<div class="code-comment">${line}</div>`;
                } else {
                    return `<div class="code-line">${line}</div>`;
                }
            }).join('');

            // Play the pattern
            if (pattern && typeof pattern.play === 'function') {
                pattern.play();
                console.log('Pattern started');
            } else {
                console.error('Could not play pattern');
                status.textContent = 'Error: Pattern failed';
            }

        } catch (error) {
            console.error('Error playing pattern:', error);
            status.textContent = 'Error: ' + error.message;
        }
    }
</script>
</body>
</html>
