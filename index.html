<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strood · Generative IDM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #111114;
            --text-primary: #c8ccd4;
            --text-secondary: #5a6070;
            --accent: #4a9eff;
            --mood-color: #4a9eff;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                    circle at 30% 40%,
                    var(--mood-color) 0%,
                    transparent 40%
            ),
            radial-gradient(
                    circle at 70% 70%,
                    var(--mood-color) 0%,
                    transparent 40%
            );
            opacity: 0.08;
            filter: blur(100px);
            animation: drift 30s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, -40px) rotate(90deg); }
            50% { transform: translate(-30px, 30px) rotate(180deg); }
            75% { transform: translate(40px, 20px) rotate(270deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 95%;
            padding: 2.5rem;
            background: rgba(17, 17, 20, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            text-align: center;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.65rem;
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .mood-grid .mood-btn:nth-child(n+7) {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .mood-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            padding: 1.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            position: relative;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .mood-btn.active {
            background: var(--mood-color);
            border-color: var(--mood-color);
            color: var(--bg-primary);
            box-shadow: 0 0 40px rgba(74, 158, 255, 0.2);
        }

        .mood-btn .mood-desc {
            display: block;
            font-size: 0.55rem;
            margin-top: 0.5rem;
            opacity: 0.6;
            letter-spacing: 0.1em;
            text-transform: none;
        }

        .evolution-display {
            margin-bottom: 2rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2px;
        }

        .evolution-header {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--mood-color);
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .evolution-bars {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .evolution-bar {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .evolution-bar-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .evolution-bar-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .evolution-bar-fill {
            height: 100%;
            background: var(--mood-color);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .cycle-timer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .cycle-timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .cycle-timer-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .cycle-timer-count {
            font-size: 0.55rem;
            color: var(--mood-color);
            opacity: 0.8;
        }

        .cycle-timer-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .cycle-timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--mood-color), var(--mood-color));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .cycle-timer-fill.pulse {
            animation: timerPulse 0.4s ease-out;
        }

        .cycle-timer-fill.radical {
            background: linear-gradient(90deg, var(--mood-color), #ff6b6b);
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.4);
        }

        .cycle-timer-label.radical {
            color: #ff6b6b;
        }

        @keyframes timerPulse {
            0% {
                box-shadow: 0 0 10px var(--mood-color);
                opacity: 1;
            }
            100% {
                box-shadow: 0 0 0px var(--mood-color);
                opacity: 0.8;
            }
        }

        .play-controls {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .play-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 0.9rem 2.5rem;
            background: var(--mood-color);
            border: none;
            border-radius: 2px;
            color: var(--bg-primary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            filter: brightness(1.1);
        }

        .play-btn.stop {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        .play-btn.stop:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .status {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .status.playing {
            color: var(--mood-color);
        }

        .code-display {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.7;
        }

        .code-display-header {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--mood-color);
            margin-bottom: 0.75rem;
            opacity: 0.7;
        }

        .code-line {
            color: var(--text-primary);
            margin: 0.2rem 0;
        }

        .code-comment {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .code-display::-webkit-scrollbar {
            width: 4px;
        }

        .code-display::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .code-display::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .mood-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .evolution-bars {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Strood</h1>
    <p class="subtitle">Evolving Generative Soundscapes</p>

    <div class="mood-grid">
        <button class="mood-btn" data-mood="metallic">
            Metallic
            <span class="mood-desc">Cold FM textures, machine pulse</span>
        </button>
        <button class="mood-btn" data-mood="fractured">
            Fractured
            <span class="mood-desc">Granular glitch, bit decay</span>
        </button>
        <button class="mood-btn" data-mood="submerged">
            Submerged
            <span class="mood-desc">Deep sub, filtered darkness</span>
        </button>
        <button class="mood-btn" data-mood="algorithmic">
            Algorithmic
            <span class="mood-desc">Polyrhythmic complexity</span>
        </button>
        <button class="mood-btn" data-mood="crystalline">
            Crystalline
            <span class="mood-desc">FM bells, sparse ethereal</span>
        </button>
        <button class="mood-btn" data-mood="industrial">
            Industrial
            <span class="mood-desc">Resonant, mechanical, raw</span>
        </button>
        <button class="mood-btn" data-mood="ethereal">
            Ethereal
            <span class="mood-desc">Dreamy pads, floating melody</span>
        </button>
        <button class="mood-btn" data-mood="nostalgia">
            Nostalgia
            <span class="mood-desc">Warm arpeggios, gentle glow</span>
        </button>
        <button class="mood-btn" data-mood="drift">
            Drift
            <span class="mood-desc">Slow ambient, soft washes</span>
        </button>
    </div>

    <div class="evolution-display">
        <div class="evolution-header">Evolution State</div>
        <div class="evolution-bars">
            <div class="evolution-bar">
                <span class="evolution-bar-label">Filter</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="filter-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">FM Depth</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="fm-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">Density</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="density-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">Space</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="space-bar"></div>
                </div>
            </div>
        </div>
        <div class="cycle-timer">
            <div class="cycle-timer-header">
                <span class="cycle-timer-label">Next Evolution</span>
                <span class="cycle-timer-count" id="cycle-count">Cycle 0</span>
            </div>
            <div class="cycle-timer-track">
                <div class="cycle-timer-fill" id="cycle-timer-fill"></div>
            </div>
        </div>
    </div>

    <div class="play-controls">
        <button class="play-btn" id="play-btn">Initiate</button>
        <button class="play-btn stop" id="stop-btn">Halt</button>
    </div>

    <div class="status" id="status">Awaiting initialization...</div>

    <div class="code-display" id="code-display">
        <div class="code-display-header">Active Pattern</div>
        <div id="code-content" class="code-comment">// Pattern code will appear when active</div>
    </div>
</div>

<!-- Load Strudel Web bundle with SRI for supply chain security -->
<script src="https://unpkg.com/@strudel/web@1.2.6"
        integrity="sha384-6SxFGprJU+pzaOgfaK+HU0ILOMhDKJ6O5uAExCh2wD/WtS5I4xa2cKZpaUuozLlq"
        crossorigin="anonymous"></script>

<script src="js/namespace.js"></script>

<script src="js/State.js"></script>
<script src="js/Evolution.js"></script>
<script src="js/UI.js"></script>
<script src="js/Engine.js"></script>
<script src="js/moods/BaseMood.js"></script>
<script src="js/moods/Metallic.js"></script>
<script src="js/moods/Fractured.js"></script>
<script src="js/moods/Submerged.js"></script>
<script src="js/moods/Algorithmic.js"></script>
<script src="js/moods/Crystalline.js"></script>
<script src="js/moods/Industrial.js"></script>
<script src="js/moods/Ethereal.js"></script>
<script src="js/moods/Nostalgia.js"></script>
<script src="js/moods/Drift.js"></script>
<script src="js/moods/registry.js"></script>
<script src="js/main.js"></script>
</body>
</html>
