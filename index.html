<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strood · Generative IDM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0c;
            --bg-secondary: #111114;
            --text-primary: #c8ccd4;
            --text-secondary: #5a6070;
            --accent: #4a9eff;
            --mood-color: #4a9eff;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                    circle at 30% 40%,
                    var(--mood-color) 0%,
                    transparent 40%
            ),
            radial-gradient(
                    circle at 70% 70%,
                    var(--mood-color) 0%,
                    transparent 40%
            );
            opacity: 0.08;
            filter: blur(100px);
            animation: drift 30s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, -40px) rotate(90deg); }
            50% { transform: translate(-30px, 30px) rotate(180deg); }
            75% { transform: translate(40px, 20px) rotate(270deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 95%;
            padding: 2.5rem;
            background: rgba(17, 17, 20, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            text-align: center;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.65rem;
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .mood-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            padding: 1.25rem 0.75rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            position: relative;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
        }

        .mood-btn.active {
            background: var(--mood-color);
            border-color: var(--mood-color);
            color: var(--bg-primary);
            box-shadow: 0 0 40px rgba(74, 158, 255, 0.2);
        }

        .mood-btn .mood-desc {
            display: block;
            font-size: 0.55rem;
            margin-top: 0.5rem;
            opacity: 0.6;
            letter-spacing: 0.1em;
            text-transform: none;
        }

        .evolution-display {
            margin-bottom: 2rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2px;
        }

        .evolution-header {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--mood-color);
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .evolution-bars {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .evolution-bar {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .evolution-bar-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .evolution-bar-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .evolution-bar-fill {
            height: 100%;
            background: var(--mood-color);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .cycle-timer {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .cycle-timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .cycle-timer-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .cycle-timer-count {
            font-size: 0.55rem;
            color: var(--mood-color);
            opacity: 0.8;
        }

        .cycle-timer-track {
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .cycle-timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--mood-color), var(--mood-color));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .cycle-timer-fill.pulse {
            animation: timerPulse 0.4s ease-out;
        }

        @keyframes timerPulse {
            0% {
                box-shadow: 0 0 10px var(--mood-color);
                opacity: 1;
            }
            100% {
                box-shadow: 0 0 0px var(--mood-color);
                opacity: 0.8;
            }
        }

        .play-controls {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .play-btn {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 0.9rem 2.5rem;
            background: var(--mood-color);
            border: none;
            border-radius: 2px;
            color: var(--bg-primary);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            filter: brightness(1.1);
        }

        .play-btn.stop {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        .play-btn.stop:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }

        .status {
            text-align: center;
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .status.playing {
            color: var(--mood-color);
        }

        .code-display {
            margin-top: 1.5rem;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            font-size: 0.65rem;
            color: var(--text-secondary);
            max-height: 180px;
            overflow-y: auto;
            line-height: 1.7;
        }

        .code-display-header {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--mood-color);
            margin-bottom: 0.75rem;
            opacity: 0.7;
        }

        .code-line {
            color: var(--text-primary);
            margin: 0.2rem 0;
        }

        .code-comment {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .code-display::-webkit-scrollbar {
            width: 4px;
        }

        .code-display::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .code-display::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .mood-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .evolution-bars {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Strood</h1>
    <p class="subtitle">Evolving Generative Soundscapes</p>

    <div class="mood-grid">
        <button class="mood-btn" data-mood="metallic">
            Metallic
            <span class="mood-desc">Cold FM textures, machine pulse</span>
        </button>
        <button class="mood-btn" data-mood="fractured">
            Fractured
            <span class="mood-desc">Granular glitch, bit decay</span>
        </button>
        <button class="mood-btn" data-mood="submerged">
            Submerged
            <span class="mood-desc">Deep sub, filtered darkness</span>
        </button>
        <button class="mood-btn" data-mood="algorithmic">
            Algorithmic
            <span class="mood-desc">Polyrhythmic complexity</span>
        </button>
        <button class="mood-btn" data-mood="crystalline">
            Crystalline
            <span class="mood-desc">FM bells, sparse ethereal</span>
        </button>
        <button class="mood-btn" data-mood="industrial">
            Industrial
            <span class="mood-desc">Resonant, mechanical, raw</span>
        </button>
    </div>

    <div class="evolution-display">
        <div class="evolution-header">Evolution State</div>
        <div class="evolution-bars">
            <div class="evolution-bar">
                <span class="evolution-bar-label">Filter</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="filter-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">FM Depth</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="fm-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">Density</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="density-bar"></div>
                </div>
            </div>
            <div class="evolution-bar">
                <span class="evolution-bar-label">Space</span>
                <div class="evolution-bar-track">
                    <div class="evolution-bar-fill" id="space-bar"></div>
                </div>
            </div>
        </div>
        <div class="cycle-timer">
            <div class="cycle-timer-header">
                <span class="cycle-timer-label">Next Modulation</span>
                <span class="cycle-timer-count" id="cycle-count">Cycle 0</span>
            </div>
            <div class="cycle-timer-track">
                <div class="cycle-timer-fill" id="cycle-timer-fill"></div>
            </div>
        </div>
    </div>

    <div class="play-controls">
        <button class="play-btn" id="play-btn">Initiate</button>
        <button class="play-btn stop" id="stop-btn">Halt</button>
    </div>

    <div class="status" id="status">Awaiting initialization...</div>

    <div class="code-display" id="code-display">
        <div class="code-display-header">Active Pattern</div>
        <div id="code-content" class="code-comment">// Pattern code will appear when active</div>
    </div>
</div>

<!-- Load Strudel Web bundle -->
<script src="https://unpkg.com/@strudel/web@1.2.6"></script>

<script>
    // Mood color mappings - industrial/cold palette
    const moodColors = {
        metallic: '#4a9eff',
        fractured: '#ff6b4a',
        submerged: '#1a8f7d',
        algorithmic: '#9b6bff',
        crystalline: '#7dd3fc',
        industrial: '#f97316'
    };

    // State
    let currentMood = null;
    let isPlaying = false;
    let strudelReady = false;
    let evolutionInterval = null;
    let evolutionState = {
        filter: 0.3,
        fm: 0.4,
        density: 0.5,
        space: 0.6
    };
    let cycleState = {
        startTime: 0,
        duration: 12000, // 12 seconds per cycle
        count: 0
    };

    // DOM elements
    const moodButtons = document.querySelectorAll('.mood-btn');
    const playButton = document.getElementById('play-btn');
    const stopButton = document.getElementById('stop-btn');
    const status = document.getElementById('status');
    const codeContent = document.getElementById('code-content');
    const filterBar = document.getElementById('filter-bar');
    const fmBar = document.getElementById('fm-bar');
    const densityBar = document.getElementById('density-bar');
    const spaceBar = document.getElementById('space-bar');
    const cycleTimerFill = document.getElementById('cycle-timer-fill');
    const cycleCount = document.getElementById('cycle-count');

    // Wait for Strudel to load and initialize
    async function initStrudelApp() {
        try {
            await new Promise(resolve => setTimeout(resolve, 500));

            if (typeof initStrudel === 'function') {
                console.log('Initializing Strudel...');
                await initStrudel({
                    prebake: () => {
                        console.log('Loading drum samples...');
                        return samples('https://strudel.b-cdn.net/tidal-drum-machines.json');
                    }
                });
                console.log('Strudel initialized');

                strudelReady = true;
                status.textContent = 'Select mode to begin';
            } else {
                console.error('initStrudel not found');
                status.textContent = 'Error: Engine not loaded';
            }
        } catch (error) {
            console.error('Error initializing Strudel:', error);
            status.textContent = 'Error: ' + error.message;
        }
    }

    // Initialize when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initStrudelApp);
    } else {
        initStrudelApp();
    }

    // Update evolution bars
    function updateEvolutionBars() {
        filterBar.style.width = `${evolutionState.filter * 100}%`;
        fmBar.style.width = `${evolutionState.fm * 100}%`;
        densityBar.style.width = `${evolutionState.density * 100}%`;
        spaceBar.style.width = `${evolutionState.space * 100}%`;
    }

    // Evolve state naturally
    function evolveState() {
        const time = Date.now() / 1000;
        const now = Date.now();

        // Use different sine wave periods for each parameter
        evolutionState.filter = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.05));
        evolutionState.fm = 0.2 + 0.6 * (0.5 + 0.5 * Math.sin(time * 0.03 + 1));
        evolutionState.density = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.04 + 2));
        evolutionState.space = 0.4 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.025 + 3));

        updateEvolutionBars();

        // Update cycle timer
        const elapsed = now - cycleState.startTime;
        const progress = Math.min(elapsed / cycleState.duration, 1);
        cycleTimerFill.style.width = `${progress * 100}%`;

        // Check if cycle completed
        if (elapsed >= cycleState.duration) {
            cycleState.count++;
            cycleState.startTime = now;
            cycleCount.textContent = `Cycle ${cycleState.count}`;

            // Pulse animation on cycle complete
            cycleTimerFill.classList.add('pulse');
            setTimeout(() => cycleTimerFill.classList.remove('pulse'), 400);

            // Randomize next cycle duration (8-16 seconds)
            cycleState.duration = 8000 + Math.random() * 8000;
        }
    }

    // Reset cycle timer
    function resetCycleTimer() {
        cycleState.startTime = Date.now();
        cycleState.count = 0;
        cycleState.duration = 12000;
        cycleTimerFill.style.width = '0%';
        cycleCount.textContent = 'Cycle 0';
    }

    // Mood selection
    moodButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const mood = btn.dataset.mood;
            currentMood = mood;

            moodButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.documentElement.style.setProperty('--mood-color', moodColors[mood]);
            status.textContent = `${mood.toUpperCase()} mode selected`;

            if (isPlaying) {
                playPattern();
            }
        });
    });

    // Play/Stop controls
    playButton.addEventListener('click', () => {
        if (!strudelReady) {
            status.textContent = 'Engine initializing...';
            return;
        }
        if (!currentMood) {
            status.textContent = 'Select mode first';
            return;
        }
        isPlaying = true;
        playPattern();
        status.textContent = `${currentMood.toUpperCase()} active`;
        status.classList.add('playing');

        // Reset and start cycle timer
        resetCycleTimer();

        // Start evolution animation
        if (evolutionInterval) clearInterval(evolutionInterval);
        evolutionInterval = setInterval(evolveState, 100);
    });

    stopButton.addEventListener('click', () => {
        isPlaying = false;
        if (typeof hush === 'function') {
            hush();
        }
        if (evolutionInterval) {
            clearInterval(evolutionInterval);
            evolutionInterval = null;
        }
        // Reset timer display
        cycleTimerFill.style.width = '0%';
        cycleCount.textContent = 'Cycle 0';

        status.textContent = currentMood ? `${currentMood.toUpperCase()} halted` : 'Halted';
        status.classList.remove('playing');
        codeContent.innerHTML = '<div class="code-comment">// Pattern halted</div>';
    });

    function playPattern() {
        if (!currentMood || !strudelReady) return;

        console.log('Playing mood:', currentMood);

        if (typeof hush === 'function') {
            hush();
        }

        let codeLines = [];

        try {
            let pattern;

            switch(currentMood) {
                case 'metallic':
                    // Cold FM textures with machine pulse
                    codeLines = [
                        '// METALLIC - Cold FM textures',
                        'stack(',
                        '  s("bd(3,8)").bank("RolandTR909")',
                        '    .gain(0.6).room(0.4).lpf(800),',
                        '  s("hh(11,16)").bank("RolandTR808")',
                        '    .n(irand(4)).gain(0.35).room(0.7)',
                        '    .delay(0.3).pan(rand.range(0.3,0.7)).hpf(3000),',
                        '  note("<c2 eb2 f2 ab2>/4").s("sawtooth")',
                        '    .fm(perlin.range(2,5).slow(8))',
                        '    .fmh(sine.range(0.5,2).slow(6))',
                        '    .lpf(perlin.range(300,600).slow(4))',
                        '    .lpq(8).gain(0.5).room(0.3),',
                        '  note("<c5 ~ eb5 ~ ~ f5 ~ ~>/2").s("square")',
                        '    .lpf(2000).gain(0.2).room(0.8)',
                        '    .delay(0.5).pan(rand)',
                        ')'
                    ];
                    pattern = stack(
                        s("bd(3,8)").bank("RolandTR909")
                            .gain(0.6).room(0.4).lpf(800),
                        s("hh(11,16)").bank("RolandTR808")
                            .n(irand(4)).gain(0.35).room(0.7)
                            .delay(0.3).pan(rand.range(0.3, 0.7)).hpf(3000),
                        s("~ sd(3,8,<0 2 1>)").bank("RolandTR909")
                            .gain(0.5).room(0.6),
                        note("<c2 eb2 f2 ab2>/4")
                            .s("sawtooth")
                            .fm(perlin.range(2, 5).slow(8))
                            .fmh(sine.range(0.5, 2).slow(6))
                            .lpf(perlin.range(300, 600).slow(4))
                            .lpq(8)
                            .gain(0.5)
                            .room(0.3),
                        note("<c5 ~ eb5 ~ ~ f5 ~ ~>/2")
                            .s("square")
                            .lpf(2000)
                            .gain(0.2)
                            .room(0.8)
                            .delay(0.5)
                            .pan(rand)
                    );
                    break;

                case 'fractured':
                    // Granular glitch, bit-crushed textures
                    codeLines = [
                        '// FRACTURED - Granular glitch',
                        'stack(',
                        '  s("bd ~ bd:1 ~").bank("RolandTR909")',
                        '    .gain(0.65).room(0.4).lpf(600),',
                        '  s("hh*<8 12 16 6>").bank("RolandTR808")',
                        '    .n(irand(4)).gain(rand.range(0.2,0.45))',
                        '    .room(0.8).delay(0.5).hpf(4000).pan(rand),',
                        '  note("<c4 eb4 f4 ab4>*4").s("triangle")',
                        '    .chop("<2 4 8 4>").coarse("<8 16 32 16>")',
                        '    .lpf(perlin.range(1000,2000).slow(4))',
                        '    .gain(0.25).room(1.0).delay(0.6).pan(rand),',
                        '  note("<c2 f2>/4").s("square").fm(2)',
                        '    .lpf(350).lpq(20).gain(0.4).room(0.5)',
                        ')'
                    ];
                    pattern = stack(
                        s("bd ~ bd:1 ~").bank("RolandTR909")
                            .gain(0.65).room(0.4).lpf(600),
                        s("hh*<8 12 16 6>").bank("RolandTR808")
                            .n(irand(4)).gain(rand.range(0.2, 0.45))
                            .room(0.8).delay(0.5).hpf(4000).pan(rand),
                        s("~ [sd cp] ~ <sd rim>").bank("RolandTR909")
                            .gain(0.5).room(0.7),
                        note("<c4 eb4 f4 ab4>*4")
                            .s("triangle")
                            .chop("<2 4 8 4>")
                            .coarse("<8 16 32 16>")
                            .lpf(perlin.range(1000, 2000).slow(4))
                            .gain(0.25)
                            .room(1.0)
                            .delay(0.6)
                            .pan(rand),
                        note("<c2 f2>/4")
                            .s("square")
                            .fm(2)
                            .lpf(350)
                            .lpq(20)
                            .gain(0.4)
                            .room(0.5)
                    );
                    break;

                case 'submerged':
                    // Deep sub bass with filtered darkness
                    codeLines = [
                        '// SUBMERGED - Deep filtered darkness',
                        'stack(',
                        '  s("bd(5,8)").bank("RolandTR909")',
                        '    .gain(0.7).room(0.3).lpf(700).distort(0.2),',
                        '  s("hh(13,16)").bank("RolandTR808")',
                        '    .n(irand(3)).gain(0.3).room(0.6).hpf(3500),',
                        '  note("<c1 ~ eb1 ~ f1 ~ ab1 ~>/2").s("sine")',
                        '    .gain(0.7).lpf(120).room(0.2),',
                        '  note("<c2 ~ f2 ~ ab2 ~>/2").s("sawtooth")',
                        '    .fm(4).fmh(2)',
                        '    .lpf(perlin.range(200,500).slow(8))',
                        '    .lpq(15).gain(0.5).room(0.4).distort(0.15),',
                        '  note("<[c3,eb3,g3]>/8").s("sawtooth")',
                        '    .lpf(sine.range(300,700).slow(16))',
                        '    .gain(0.25).room(1.5).attack(2).release(3)',
                        ').slow(1.5)'
                    ];
                    pattern = stack(
                        s("bd(5,8)").bank("RolandTR909")
                            .gain(0.7).room(0.3).lpf(700).distort(0.2),
                        s("hh(13,16)").bank("RolandTR808")
                            .n(irand(3)).gain(0.3).room(0.6).hpf(3500),
                        s("oh(5,8,<0 1 2>)").bank("RolandTR909")
                            .gain(0.25).room(1.0).delay(0.6),
                        note("<c1 ~ eb1 ~ f1 ~ ab1 ~>/2")
                            .s("sine")
                            .gain(0.7)
                            .lpf(120)
                            .room(0.2),
                        note("<c2 ~ f2 ~ ab2 ~>/2")
                            .s("sawtooth")
                            .fm(4)
                            .fmh(2)
                            .lpf(perlin.range(200, 500).slow(8))
                            .lpq(15)
                            .gain(0.5)
                            .room(0.4)
                            .distort(0.15),
                        note("<[c3,eb3,g3] [bb2,db3,f3] [ab2,c3,eb3]>/8")
                            .s("sawtooth")
                            .lpf(sine.range(300, 700).slow(16))
                            .lpq(10)
                            .gain(0.25)
                            .room(1.5)
                            .attack(2)
                            .release(3)
                    ).slow(1.5);
                    break;

                case 'algorithmic':
                    // Polyrhythmic complexity with euclidean patterns
                    codeLines = [
                        '// ALGORITHMIC - Polyrhythmic complexity',
                        'stack(',
                        '  s("bd(<3 5 2 4>,<8 7 9 11>)").bank("RolandTR909")',
                        '    .gain(0.6).room(0.4).lpf("<700 900 600>"),',
                        '  s("hh(<13 17 11>,<16 16 16>)").bank("RolandTR808")',
                        '    .n(irand(4)).gain(rand.range(0.25,0.4))',
                        '    .room(perlin.range(0.5,0.9).slow(8))',
                        '    .delay(perlin.range(0.3,0.6).slow(4))',
                        '    .hpf(rand.range(3000,5000)).pan(rand),',
                        '  s("sd(<3 4 5>,<8 9 7>,<0 1 2 3>)").bank("RolandTR909")',
                        '    .gain(0.5).room(0.6),',
                        '  note("c4 eb4 g4 bb4 d5 bb4 g4 eb4".fast("<1 1.5 2>"))',
                        '    .s("square").lpf(perlin.range(1000,2500).slow(4))',
                        '    .gain(0.2).room(0.8).delay(0.5),',
                        '  note("<c1 f1>/8").s("sine").fm(0.5)',
                        '    .gain(0.45).lpf(200).room(0.8)',
                        ')'
                    ];
                    pattern = stack(
                        s("bd(<3 5 2 4>,<8 7 9 11>)").bank("RolandTR909")
                            .gain(0.6).room(0.4).lpf("<700 900 600>"),
                        s("hh(<13 17 11>,<16 16 16>)").bank("RolandTR808")
                            .n(irand(4)).gain(rand.range(0.25, 0.4))
                            .room(perlin.range(0.5, 0.9).slow(8))
                            .delay(perlin.range(0.3, 0.6).slow(4))
                            .hpf(rand.range(3000, 5000)).pan(rand),
                        s("sd(<3 4 5>,<8 9 7>,<0 1 2 3>)").bank("RolandTR909")
                            .gain(0.5).room(0.6),
                        note("c4 eb4 g4 bb4 d5 bb4 g4 eb4".fast("<1 1.5 2>"))
                            .s("square")
                            .lpf(perlin.range(1000, 2500).slow(4))
                            .gain(0.2)
                            .room(0.8)
                            .delay(0.5),
                        note("<c1 f1>/8")
                            .s("sine")
                            .fm(0.5)
                            .gain(0.45)
                            .lpf(200)
                            .room(0.8)
                    );
                    break;

                case 'crystalline':
                    // FM bells, sparse and ethereal
                    codeLines = [
                        '// CRYSTALLINE - FM bells, ethereal',
                        'stack(',
                        '  s("bd*3").bank("RolandTR909")',
                        '    .gain(0.6).room(0.4).lpf(700).slow(2),',
                        '  s("hh*13").bank("RolandTR808")',
                        '    .n(irand(4)).gain(rand.range(0.25,0.35))',
                        '    .room(0.7).delay(0.3).hpf(3500).slow(2),',
                        '  note("<c5 ~ eb5 ~ g5 ~ bb5 ~ c6 ~>/2").s("sine")',
                        '    .fm(sine.range(4,12).slow(12))',
                        '    .fmh(perlin.range(2,6).slow(8))',
                        '    .lpf(4000).gain(0.22).room(1.5)',
                        '    .delay(0.7).delaytime("<0.25 0.375 0.5>").pan(rand),',
                        '  note("~ c5 ~ ~ ~ eb5 ~ ~ ~ ~ g5 ~ ~ ~ bb5 ~")',
                        '    .s("sine").lpf(3000).gain(0.25)',
                        '    .room(1.2).delay(0.7).delayfeedback(0.8),',
                        '  note("<[c3,e3,g3] [bb2,d3,f3]>/8").s("sawtooth")',
                        '    .chop(16).lpf(900).gain(0.18).room(1.3)',
                        ')'
                    ];
                    pattern = stack(
                        s("bd*3").bank("RolandTR909")
                            .gain(0.6).room(0.4).lpf(700).slow(2),
                        s("hh*13").bank("RolandTR808")
                            .n(irand(4)).gain(rand.range(0.25, 0.35))
                            .room(0.7).delay(0.3).hpf(3500).slow(2),
                        s("sd*5").bank("RolandTR909")
                            .gain(0.45).room(0.6).slow(2),
                        note("<c5 ~ eb5 ~ g5 ~ bb5 ~ c6 ~>/2")
                            .s("sine")
                            .fm(sine.range(4, 12).slow(12))
                            .fmh(perlin.range(2, 6).slow(8))
                            .lpf(4000)
                            .gain(0.22)
                            .room(1.5)
                            .delay(0.7)
                            .delaytime("<0.25 0.375 0.5>")
                            .pan(rand),
                        note("~ c5 ~ ~ ~ eb5 ~ ~ ~ ~ g5 ~ ~ ~ bb5 ~")
                            .s("sine")
                            .lpf(3000)
                            .gain(0.25)
                            .room(1.2)
                            .delay(0.7)
                            .delayfeedback(0.8),
                        note("<[c3,e3,g3] [bb2,d3,f3]>/8")
                            .s("sawtooth")
                            .chop(16)
                            .lpf(900)
                            .gain(0.18)
                            .room(1.3)
                    );
                    break;

                case 'industrial':
                    // Resonant, mechanical, raw
                    codeLines = [
                        '// INDUSTRIAL - Resonant mechanical',
                        'stack(',
                        '  s("bd(<3 5>,<8 9>)").bank("RolandTR909")',
                        '    .gain(0.7).room(0.4).lpf(700)',
                        '    .sometimes(x => x.distort(0.3)),',
                        '  s("hh(<11 13>,16)").bank("RolandTR808")',
                        '    .n(irand(4)).gain(rand.range(0.3,0.45))',
                        '    .room(0.7).delay(0.4).hpf(3800)',
                        '    .sometimes(x => x.chop(2)),',
                        '  note("<c2 eb2 f2 ab2 bb2>/2").s("sawtooth")',
                        '    .fm(perlin.range(2,8).slow(8))',
                        '    .fmh(sine.range(1,4).slow(6))',
                        '    .lpf(perlin.range(300,800).slow(4))',
                        '    .lpq(18).gain(0.55).room(0.5).distort(0.2),',
                        '  note("<c4 db4 e4 f4 ab4 bb4>*2".add(irand(7)))',
                        '    .s("square").lpf(perlin.range(800,2000).slow(4))',
                        '    .lpq(6).gain(0.3).room(0.8).delay(0.5)',
                        ')'
                    ];
                    pattern = stack(
                        s("bd(<3 5>,<8 9>)").bank("RolandTR909")
                            .gain(0.7).room(0.4).lpf(700)
                            .sometimes(x => x.distort(0.3)),
                        s("hh(<11 13>,16)").bank("RolandTR808")
                            .n(irand(4)).gain(rand.range(0.3, 0.45))
                            .room(0.7).delay(0.4).hpf(3800)
                            .sometimes(x => x.chop(2))
                            .rarely(x => x.fast(2)),
                        s("sd(<3 4>,<8 7>,<0 2>)").bank("RolandTR909")
                            .gain(0.55).room(0.6),
                        note("<c2 eb2 f2 ab2 bb2>/2")
                            .s("sawtooth")
                            .fm(perlin.range(2, 8).slow(8))
                            .fmh(sine.range(1, 4).slow(6))
                            .lpf(perlin.range(300, 800).slow(4))
                            .lpq(18)
                            .gain(0.55)
                            .room(0.5)
                            .distort(0.2),
                        note("<c4 db4 e4 f4 ab4 bb4>*2".add(irand(7)))
                            .s("square")
                            .lpf(perlin.range(800, 2000).slow(4))
                            .lpq(6)
                            .gain(0.3)
                            .room(0.8)
                            .delay(0.5),
                        note("<[c2,e2,g2] [db2,f2,ab2]>/16")
                            .s("sawtooth")
                            .lpf(400)
                            .gain(0.3)
                            .room(1.5)
                            .attack(3)
                            .release(4)
                    );
                    break;
            }

            // Update code display
            codeContent.innerHTML = codeLines.map((line) => {
                if (line.startsWith('//')) {
                    return `<div class="code-comment">${line}</div>`;
                } else {
                    return `<div class="code-line">${line}</div>`;
                }
            }).join('');

            // Play the pattern
            if (pattern && typeof pattern.play === 'function') {
                pattern.play();
                console.log('Pattern started');
            } else {
                console.error('Could not play pattern');
                status.textContent = 'Error: Pattern failed';
            }

        } catch (error) {
            console.error('Error playing pattern:', error);
            status.textContent = 'Error: ' + error.message;
        }
    }
</script>
</body>
</html>
